<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Trading Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pure-black: #000000;
            --deep-black: #0a0a0a;
            --neon-green: #00ff88;
            --neon-yellow: #ffdd00;
            --dark-green: #003322;
            --glass-bg: rgba(0, 0, 0, 0.7);
            --glass-border: rgba(0, 255, 136, 0.3);
            --glass-hover: rgba(0, 255, 136, 0.1);
            --neon-glow: 0 0 20px rgba(0, 255, 136, 0.5);
            --text-glow: 0 0 10px rgba(0, 255, 136, 0.8);
            --font-display: 'Orbitron', monospace;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--pure-black);
            color: var(--neon-green);
            font-family: var(--font-mono);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Matrix Background */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--glass-bg), rgba(0, 20, 10, 0.9));
            border-bottom: 2px solid var(--glass-border);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            max-width: 1800px;
            margin: 0 auto;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .vfx-logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--neon-glow);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: var(--neon-glow);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Main Content */
        .main-content {
            display: flex;
            gap: 2rem;
            padding: 2rem;
            max-width: 1800px;
            margin: 0 auto;
            flex: 1;
        }

        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Panels */
        .panel {
            background: linear-gradient(135deg, var(--glass-bg), rgba(0, 0, 0, 0.8));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(15px);
            box-shadow: var(--neon-glow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-header h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--neon-yellow);
            text-shadow: var(--text-glow);
        }

        /* Chart Panel */
        .chart-panel {
            height: 500px;
        }

        .chart-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .timeframe-group {
            display: flex;
            gap: 0.5rem;
        }

        .timeframe-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--neon-green);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .timeframe-btn:hover,
        .timeframe-btn.active {
            background: var(--glass-hover);
            box-shadow: var(--neon-glow);
            color: var(--neon-yellow);
        }

        .instrument-selector {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--neon-green);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            margin-left: auto;
        }

        #tradingChart {
            width: 100%;
            height: 400px;
            border-radius: 8px;
        }

        /* Market Data Panel */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .market-item {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .market-item:hover {
            background: var(--glass-hover);
            box-shadow: var(--neon-glow);
        }

        .market-item.active {
            border-color: var(--neon-yellow);
            background: rgba(255, 221, 0, 0.1);
        }

        .market-symbol {
            font-weight: 700;
            color: var(--neon-yellow);
            font-size: 0.9rem;
        }

        .market-price {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .market-change {
            font-size: 0.8rem;
        }

        .price-up { color: var(--neon-green); }
        .price-down { color: #ff4444; }

        /* Order Book Panel */
        .orderbook-container {
            height: 400px;
            overflow-y: auto;
        }

        .orderbook-section {
            margin-bottom: 1rem;
        }

        .orderbook-section h4 {
            font-size: 0.9rem;
            color: var(--neon-yellow);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            padding: 0.3rem 0;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .asks .orderbook-row { color: #ff4444; }
        .bids .orderbook-row { color: var(--neon-green); }

        /* Portfolio Panel */
        .portfolio-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(0, 255, 136, 0.7);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-yellow);
        }

        /* Loading States */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            color: rgba(0, 255, 136, 0.7);
            font-size: 0.9rem;
        }

        .error {
            color: #ff4444;
            text-align: center;
            padding: 1rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-green), var(--neon-yellow));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--neon-yellow), var(--neon-green));
        }
    </style>
</head>
<body>
    <!-- Matrix Background -->
    <canvas id="matrix-bg"></canvas>
    
    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="vfx-logo">VFX TRADING</div>
                </div>
                
                <div class="connection-status">
                    <div class="pulse-dot"></div>
                    <span id="connectionStatus">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel -->
            <section class="left-panel">
                <!-- Trading Chart -->
                <div class="panel chart-panel">
                    <div class="panel-header">
                        <h3>Price Chart</h3>
                        <div class="chart-controls">
                            <div class="timeframe-group">
                                <button class="timeframe-btn" data-timeframe="1m">1m</button>
                                <button class="timeframe-btn active" data-timeframe="5m">5m</button>
                                <button class="timeframe-btn" data-timeframe="15m">15m</button>
                                <button class="timeframe-btn" data-timeframe="1h">1h</button>
                                <button class="timeframe-btn" data-timeframe="4h">4h</button>
                                <button class="timeframe-btn" data-timeframe="1d">1d</button>
                            </div>
                            <select class="instrument-selector" id="instrumentSelector">
                                <option value="">Select Instrument</option>
                            </select>
                        </div>
                    </div>
                    <div id="tradingChart">Chart loading...</div>
                </div>

                <!-- Market Data -->
                <div class="panel">
                    <div class="panel-header">
                        <h3>Market Overview</h3>
                    </div>
                    <div class="market-grid" id="marketGrid">
                        <div class="loading">Loading market data...</div>
                    </div>
                </div>
            </section>

            <!-- Right Panel -->
            <section class="right-panel">
                <!-- Portfolio Summary -->
                <div class="panel">
                    <div class="panel-header">
                        <h3>Portfolio Summary</h3>
                    </div>
                    <div class="portfolio-stats">
                        <div class="stat-item">
                            <div class="stat-label">Total Value</div>
                            <div class="stat-value" id="totalValue">$0.00</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Daily P&L</div>
                            <div class="stat-value" id="dailyPnL">$0.00</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Active Positions</div>
                            <div class="stat-value" id="activePositions">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Win Rate</div>
                            <div class="stat-value" id="winRate">0%</div>
                        </div>
                    </div>
                </div>

                <!-- Order Book -->
                <div class="panel">
                    <div class="panel-header">
                        <h3>Order Book</h3>
                    </div>
                    <div class="orderbook-container">
                        <div class="orderbook-section asks">
                            <h4>Asks</h4>
                            <div id="asksList">
                                <div class="loading">Select an instrument</div>
                            </div>
                        </div>
                        
                        <div class="orderbook-section bids">
                            <h4>Bids</h4>
                            <div id="bidsList">
                                <div class="loading">Select an instrument</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Matrix Animation Script -->
    <script>
        // Matrix background animation
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const katakana = 'アカサタナハマヤラワガザダバパイキシチニヒミリヰギジヂビピウクスツヌフムユルグズブプエケセテネヘメレヱゲゼデベペオコソトノホモヨロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const draw = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        setInterval(draw, 30);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <!-- Trading UI Script -->
    <script>
        class VFXTradingPlatform {
            constructor() {
                this.ws = null;
                this.chart = null;
                this.currentInstrument = null;
                this.currentTimeframe = '5m';
                this.candleSeries = null;
                this.volumeSeries = null;
                this.chartsLoaded = false;
                this.instruments = [];
                
                this.init();
            }

            async init() {
                console.log('🚀 Initializing VFX Trading Platform...');
                await this.loadCharts();
                this.setupEventListeners();
                await this.loadInstruments();
                this.connectWebSocket();
                this.initPortfolioMetrics();
            }

            async loadCharts() {
                return new Promise((resolve) => {
                    const sources = [
                        'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
                        'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js'
                    ];
                    
                    let currentSource = 0;
                    
                    const tryLoadScript = () => {
                        if (currentSource >= sources.length) {
                            console.error('❌ Failed to load TradingView charts');
                            document.getElementById('tradingChart').innerHTML = '<div class="error">Charts library failed to load</div>';
                            resolve();
                            return;
                        }
                        
                        const script = document.createElement('script');
                        script.src = sources[currentSource];
                        script.onload = () => {
                            console.log('✅ TradingView charts loaded');
                            setTimeout(() => {
                                this.chartsLoaded = true;
                                const success = this.setupChart();
                                if (!success) {
                                    currentSource++;
                                    tryLoadScript();
                                } else {
                                    resolve();
                                }
                            }, 100);
                        };
                        script.onerror = () => {
                            currentSource++;
                            tryLoadScript();
                        };
                        
                        document.head.appendChild(script);
                    };
                    
                    tryLoadScript();
                });
            }

            setupChart() {
                if (!window.LightweightCharts) {
                    return false;
                }

                const chartContainer = document.getElementById('tradingChart');
                chartContainer.innerHTML = '';
                
                try {
                    this.chart = LightweightCharts.createChart(chartContainer, {
                        width: chartContainer.clientWidth,
                        height: 400,
                        layout: {
                            background: { color: 'transparent' },
                            textColor: '#00ff88',
                        },
                        grid: {
                            vertLines: { color: 'rgba(0, 255, 136, 0.1)' },
                            horzLines: { color: 'rgba(0, 255, 136, 0.1)' },
                        },
                        crosshair: {
                            mode: LightweightCharts.CrosshairMode.Normal,
                        },
                        rightPriceScale: {
                            borderColor: 'rgba(0, 255, 136, 0.3)',
                        },
                        timeScale: {
                            borderColor: 'rgba(0, 255, 136, 0.3)',
                            timeVisible: true,
                            secondsVisible: false,
                        },
                    });

                    this.candleSeries = this.chart.addCandlestickSeries({
                        upColor: '#00ff88',
                        downColor: '#ff4444',
                        borderDownColor: '#ff4444',
                        borderUpColor: '#00ff88',
                        wickDownColor: '#ff4444',
                        wickUpColor: '#00ff88',
                    });

                    this.volumeSeries = this.chart.addHistogramSeries({
                        color: '#ffdd00',
                        priceFormat: {
                            type: 'volume',
                        },
                        priceScaleId: '',
                        scaleMargins: {
                            top: 0.8,
                            bottom: 0,
                        },
                    });

                    new ResizeObserver(entries => {
                        if (entries.length === 0 || entries[0].target !== chartContainer) return;
                        const newRect = entries[0].contentRect;
                        this.chart.applyOptions({
                            width: newRect.width,
                            height: newRect.height
                        });
                    }).observe(chartContainer);
                    
                    console.log('✅ Chart setup completed');
                    return true;
                } catch (error) {
                    console.error('❌ Error setting up chart:', error);
                    return false;
                }
            }

            setupEventListeners() {
                // Timeframe buttons
                document.querySelectorAll('.timeframe-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.timeframe-btn.active')?.classList.remove('active');
                        e.target.classList.add('active');
                        this.currentTimeframe = e.target.dataset.timeframe;
                        if (this.currentInstrument && this.chartsLoaded) {
                            this.loadChartData(this.currentInstrument, this.currentTimeframe);
                        }
                    });
                });

                // Instrument selector
                document.getElementById('instrumentSelector').addEventListener('change', (e) => {
                    if (e.target.value) {
                        this.selectInstrument(e.target.value);
                    }
                });
            }

            async loadInstruments() {
                try {
                    console.log('📊 Loading instruments...');
                    const response = await fetch('/api/instruments');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    this.instruments = data.instruments;
                    console.log(`✅ Loaded ${this.instruments.length} instruments`);
                    
                    this.populateInstrumentSelector();
                    this.populateMarketGrid();
                    
                } catch (error) {
                    console.error('❌ Error loading instruments:', error);
                    document.getElementById('marketGrid').innerHTML = '<div class="error">Failed to load instruments</div>';
                }
            }

            populateInstrumentSelector() {
                const selector = document.getElementById('instrumentSelector');
                selector.innerHTML = '<option value="">Select Instrument</option>';
                
                this.instruments.forEach(instrument => {
                    const option = document.createElement('option');
                    option.value = instrument.symbol;
                    option.textContent = instrument.name;
                    selector.appendChild(option);
                });
            }

            populateMarketGrid() {
                const grid = document.getElementById('marketGrid');
                grid.innerHTML = '';
                
                // Show first 12 instruments
                this.instruments.slice(0, 12).forEach(instrument => {
                    const item = document.createElement('div');
                    item.className = 'market-item';
                    item.dataset.instrument = instrument.symbol;
                    item.innerHTML = `
                        <div class="market-symbol">${instrument.name}</div>
                        <div class="market-price" id="price-${instrument.symbol}">-</div>
                        <div class="market-change" id="change-${instrument.symbol}">-</div>
                    `;
                    
                    item.addEventListener('click', () => {
                        this.selectInstrument(instrument.symbol);
                    });
                    
                    grid.appendChild(item);
                });
            }

            async selectInstrument(instrument) {
                console.log(`📈 Selecting instrument: ${instrument}`);
                
                // Update UI
                document.querySelector('.market-item.active')?.classList.remove('active');
                document.querySelector(`[data-instrument="${instrument}"]`)?.classList.add('active');
                document.getElementById('instrumentSelector').value = instrument;
                
                this.currentInstrument = instrument;
                
                if (this.chartsLoaded) {
                    await this.loadChartData(instrument, this.currentTimeframe);
                }
                await this.loadOrderBook(instrument);
                
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'subscribe',
                        instruments: [instrument]
                    }));
                }
            }

            async loadChartData(instrument, timeframe) {
                if (!this.chartsLoaded || !this.chart || !this.candleSeries || !this.volumeSeries) {
                    console.warn('⚠️ Charts not ready yet');
                    return;
                }
                
                try {
                    console.log(`📊 Loading chart data for ${instrument} ${timeframe}`);
                    const response = await fetch(`/api/history/${instrument}?timeframe=${timeframe}&days=7`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.data && data.data.length > 0) {
                        const candleData = data.data.map(item => ({
                            time: new Date(item.timestamp).getTime() / 1000,
                            open: item.open,
                            high: item.high,
                            low: item.low,
                            close: item.close
                        }));
                        
                        const volumeData = data.data.map(item => ({
                            time: new Date(item.timestamp).getTime() / 1000,
                            value: item.volume,
                            color: item.close >= item.open ? '#00ff88' : '#ff4444'
                        }));
                        
                        this.candleSeries.setData(candleData);
                        this.volumeSeries.setData(volumeData);
                        
                        console.log(`✅ Loaded ${data.data.length} candles for ${instrument}`);
                    }
                } catch (error) {
                    console.error('❌ Error loading chart data:', error);
                }
            }

            async loadOrderBook(instrument) {
                try {
                    const response = await fetch(`/api/orderbook/${instrument}`);
                    const data = await response.json();
                    
                    this.updateOrderBook(data);
                } catch (error) {
                    console.error('❌ Error loading order book:', error);
                    document.getElementById('asksList').innerHTML = '<div class="loading">Error loading data</div>';
                    document.getElementById('bidsList').innerHTML = '<div class="loading">Error loading data</div>';
                }
            }

            updateOrderBook(orderbook) {
                const asksList = document.getElementById('asksList');
                const bidsList = document.getElementById('bidsList');
                
                const asks = orderbook.asks.sort((a, b) => a.price - b.price).slice(0, 10);
                asksList.innerHTML = asks.map(ask => `
                    <div class="orderbook-row">
                        <span>${ask.price.toFixed(6)}</span>
                        <span>${ask.amount.toFixed(4)}</span>
                    </div>
                `).join('');
                
                const bids = orderbook.bids.sort((a, b) => b.price - a.price).slice(0, 10);
                bidsList.innerHTML = bids.map(bid => `
                    <div class="orderbook-row">
                        <span>${bid.price.toFixed(6)}</span>
                        <span>${bid.amount.toFixed(4)}</span>
                    </div>
                `).join('');
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                
                console.log(`🔌 Connecting to WebSocket: ${wsUrl}`);
                this.ws = new WebSocket(wsUrl);
                
                this.ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    document.getElementById('connectionStatus').textContent = 'Connected';
                };
                
                this.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    this.handleWebSocketMessage(data);
                };
                
                this.ws.onclose = () => {
                    console.log('🔌 WebSocket disconnected');
                    document.getElementById('connectionStatus').textContent = 'Disconnected';
                    setTimeout(() => this.connectWebSocket(), 3000);
                };
                
                this.ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                };
            }

            handleWebSocketMessage(data) {
                switch (data.type) {
                    case 'ticker':
                        this.updateTickerPrice(data.data);
                        break;
                    case 'orderbook':
                        if (data.data.instrument === this.currentInstrument) {
                            this.updateOrderBook(data.data);
                        }
                        break;
                    case 'market_update':
                        this.updateAllPrices(data.data);
                        break;
                }
            }

            updateTickerPrice(tickerData) {
                const priceElement = document.getElementById(`price-${tickerData.instrument}`);
                const changeElement = document.getElementById(`change-${tickerData.instrument}`);
                
                if (priceElement && changeElement) {
                    const oldPrice = parseFloat(priceElement.textContent) || 0;
                    const newPrice = tickerData.close;
                    const change = ((newPrice - tickerData.open) / tickerData.open * 100);
                    
                    priceElement.textContent = newPrice.toFixed(6);
                    changeElement.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                    
                    // Color coding
                    priceElement.classList.remove('price-up', 'price-down');
                    changeElement.classList.remove('price-up', 'price-down');
                    
                    if (change >= 0) {
                        priceElement.classList.add('price-up');
                        changeElement.classList.add('price-up');
                    } else {
                        priceElement.classList.add('price-down');
                        changeElement.classList.add('price-down');
                    }
                }
            }

            updateAllPrices(marketData) {
                marketData.forEach(ticker => {
                    this.updateTickerPrice(ticker);
                });
            }

            initPortfolioMetrics() {
                // Initialize with sample data
                document.getElementById('totalValue').textContent = '$125,847.32';
                document.getElementById('dailyPnL').textContent = '+$2,847.12';
                document.getElementById('activePositions').textContent = '7';
                document.getElementById('winRate').textContent = '68.4%';
                
                // Add some color coding
                document.getElementById('dailyPnL').classList.add('price-up');
            }
        }

        // Initialize the platform when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new VFXTradingPlatform();
        });
    </script>
</body>
</html>
